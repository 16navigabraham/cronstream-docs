<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161B22;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Decorative code blocks -->
  <rect x="100" y="80" width="200" height="140" fill="#1F6FEB" opacity="0.1" rx="4"/>
  <text x="120" y="110" font-family="monospace" font-size="14" fill="#79C0FF" opacity="0.6">const stream = {</text>
  <text x="120" y="135" font-family="monospace" font-size="14" fill="#79C0FF" opacity="0.6">  duration: 2592000,</text>
  <text x="120" y="160" font-family="monospace" font-size="14" fill="#79C0FF" opacity="0.6">  rate: "1 USD/sec"</text>
  <text x="120" y="185" font-family="monospace" font-size="14" fill="#79C0FF" opacity="0.6">}</text>

  <!-- Right code block -->
  <rect x="900" y="350" width="200" height="140" fill="#238636" opacity="0.1" rx="4"/>
  <text x="920" y="380" font-family="monospace" font-size="14" fill="#3FB950" opacity="0.6">verify()</text>
  <text x="920" y="410" font-family="monospace" font-size="14" fill="#3FB950" opacity="0.6">GitHub PR ✓</text>
  <text x="920" y="440" font-family="monospace" font-size="14" fill="#3FB950" opacity="0.6">Merge ✓</text>
  <text x="920" y="470" font-family="monospace" font-size="14" fill="#3FB950" opacity="0.6">Extend ✓</text>

  <!-- Main title -->
  <text x="600" y="220" font-family="Outfit, sans-serif" font-size="80" font-weight="800" fill="#FFFFFF" text-anchor="middle">
    CronStream
  </text>

  <!-- Subtitle -->
  <text x="600" y="300" font-family="DM Sans, sans-serif" font-size="42" font-weight="600" fill="#58A6FF" text-anchor="middle">
    Documentation
  </text>

  <!-- Description -->
  <text x="600" y="380" font-family="DM Sans, sans-serif" font-size="28" fill="#8B949E" text-anchor="middle">
    API Reference & Integration Guides
  </text>

  <!-- Bottom accent -->
  <rect x="300" y="520" width="600" height="3" fill="#1F6FEB" rx="1.5"/>

  <!-- Footer -->
  <text x="600" y="580" font-family="monospace" font-size="20" fill="#30363D" text-anchor="middle">
    Complete guide to milestone-verified payments
  </text>
</svg>
